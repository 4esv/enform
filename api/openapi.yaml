# The HTTP API contract (MVP.md 9.1, DX-1). The path prefix is /api/v1.
openapi: 3.1.0
info:
  title: enform
  version: 0.1.0
  description: >-
    The HTTP API of the enform engine. It appends operations to the
    append-only log and reads the log and the state rebuilt from it. A
    configuration change is an operation whose type is
    `config.<kind>.changed@1` (I14), not a separate endpoint.
servers:
  - url: /api/v1
security:
  - keycloak: []
paths:
  /api/v1/operations:
    post:
      operationId: appendOperation
      summary: Append one operation to the log
      description: >-
        The engine applies the operation idempotently by its client-created
        ID (I1) and appends the event it records (I4). A client may post an
        intent instead of a resolved operation (ADR 0010). A start intent
        (`StartIntent`) names the flow and the values it collected, and a
        completion intent (`CompletionIntent`) names the instance, the
        outcome it chose and the values it captured. The server resolves the
        route, the transition, the assignees, the version stamp and the
        authorization through the engine before it appends. The two intents
        are told apart by `type` (`instance.started@1` or
        `step.completed@1`) and by their payload shape, and an already
        resolved operation is appended as it stands. The appended event keeps
        the client's ID and time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operation'
      responses:
        '201':
          description: The operation was appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: >-
            The operation is invalid, or an intent cannot be resolved: an
            intent that lacks the instance id, or that names an unknown
            instance, appends nothing.
        '409':
          description: >-
            The engine refused the completion and appended nothing, because
            the actor does not hold the step (AS-2), does not hold the
            outcome's scope (AC-4), or captured a field the current step does
            not make editable (FM-3, FM-4). The reason names the field or the
            step.
  /api/v1/log:
    get:
      operationId: readLog
      summary: Read the append-only log
      description: The single sequence of all events, in one global order (I4).
      responses:
        '200':
          description: The ordered events of the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
  /api/v1/state:
    get:
      operationId: readState
      summary: Read the state rebuilt from the log
      description: >-
        The derived state is rebuilt from the log (I4), so it is reproducible
        from the same sequence of events.
      responses:
        '200':
          description: The state rebuilt from the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /api/v1/flows/{slug}:
    get:
      operationId: readFlow
      summary: Read the published flow by slug
      description: >-
        The newest published version of the flow with this slug, derived from
        the append-only log (I4). An unknown slug answers 404.
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
      responses:
        '200':
          description: The newest published version of the flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFlow'
        '404':
          description: No flow has this slug
  /api/v1/instances/{instanceId}:
    get:
      operationId: readInstance
      summary: Read an instance as a step sees it
      description: >-
        The instance as one actor and the current step see it (FM-3, FM-7,
        VT-4, I8). The engine projects the instance from the append-only log
        (I4) and authorizes the read with the same rule as a write (AC-1): the
        starter, an assignee, or a principal that holds `instance.read` on the
        flow. The response holds the status line (VT-1, VT-2), the field keys
        the current step makes visible and editable (FM-3), and the values the
        instance holds restricted to the visible keys, so a field the step
        does not make visible is absent from the response (FM-3 criterion 1).
        The actor is a required query parameter, because the harness has no
        real authentication and the interface already carries the principal
        that way.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The id of the instance (DX-1, #187).
          schema:
            type: string
        - name: actor
          in: query
          required: true
          description: The principal that reads the instance (ID-4).
          schema:
            type: string
      responses:
        '200':
          description: The instance as the actor and the current step see it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceView'
        '400':
          description: The actor query parameter is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The actor may not read the instance (I8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The log holds no such instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    keycloak:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token (ADR 0005).
  schemas:
    ActorId:
      type: string
      description: >-
        An immutable directory ID that identifies a person or a group (ID-4).
        A name or an email address never identifies a principal.
    OperationId:
      type: string
      description: The client-created ID of one operation (UUIDv7).
    Operation:
      type: object
      description: One change (MVP.md 3). The client creates its ID (ADR 0004).
      required: [id, type, at, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: >-
            The versioned event type that this operation records (MVP.md 9.1).
            A configuration change uses `config.<kind>.changed@1` (I14).
          examples:
            - config.grant.changed@1
            - config.team.changed@1
            - config.connector.changed@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The change payload.
    StartIntent:
      type: object
      description: >-
        A start intent (ADR 0010): the parts a client can honestly send on
        the write path. It carries the operation ID and the instance ID it
        chose (I1, DX-1), the event type `instance.started@1`, the actor, and
        the flow and values it collected (FM-7). The server resolves the
        route, the assignees and the version stamp through the engine before
        it appends, so the client names no step and no assignee.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.started@1`.
          examples:
            - instance.started@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The flow, the instance ID and the values the client collected
            (DX-1, FM-7).
          required: [flow, instanceId, values]
          properties:
            flow:
              type: string
              description: The flow slug (ID-1).
            instanceId:
              type: string
              description: >-
                The ID that identifies the instance, minted by the client
                (DX-1). It is not the operation ID: the operation ID names one
                change, the instance ID names the instance the change acts on.
            values:
              type: object
              description: >-
                The values that the form holds: one field key to one JSON
                value (FM-7).
              additionalProperties: true
    CompletionIntent:
      type: object
      description: >-
        A completion intent (ADR 0010, FM-3, FM-4): the parts a client can
        honestly send when the holder completes the current step. It carries
        the operation ID it chose (I1), the event type `step.completed@1`,
        the actor, the instance it acts on (DX-1), the outcome the actor
        chose (AC-4) and the values the step captured (FM-7). The server
        resolves the current step, the transition, the outcome's
        authorization and the editability of every captured field through the
        engine before it appends, so the client names no step. It is told
        apart from an already resolved `step.completed@1` operation by the
        payload: an intent names no `step`, a resolved operation carries it.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `step.completed@1`.
          examples:
            - step.completed@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the outcome the actor chose and the values the step
            captured (DX-1, FM-7).
          required: [instanceId, outcome, values]
          properties:
            instanceId:
              type: string
              description: >-
                The ID of the instance whose current step is completed
                (DX-1, #187).
            outcome:
              type: string
              description: >-
                The outcome the actor chose for the current step (AC-4). The
                engine authorizes it from the actor's grants.
            values:
              type: object
              description: >-
                The values the step captured: one field key to one JSON value
                (FM-7). The engine refuses a key the current step does not
                make editable (FM-3, FM-4).
              additionalProperties: true
    Event:
      type: object
      description: >-
        An immutable, ordered record of an occurrence. The single writer
        assigns `seq` (ADR 0004).
      required: [seq, operationId, type, at, payload]
      properties:
        seq:
          type: integer
          minimum: 1
          description: The 1-based position in the append-only log.
        operationId:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type that this event records.
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The change payload.
    Log:
      type: array
      description: The single sequence of all events, in one global order.
      items:
        $ref: '#/components/schemas/Event'
    State:
      type: object
      description: The derived state, rebuilt from the log (I4).
      required: [applied, log]
      properties:
        applied:
          type: array
          description: The IDs of the operations that have been applied.
          items:
            $ref: '#/components/schemas/OperationId'
        log:
          $ref: '#/components/schemas/Log'
    PublishedFlow:
      type: object
      description: >-
        One published version of a flow, read by its slug (DF-2). The version
        is immutable and the definition is frozen.
      required: [slug, version, contentHash, definition]
      properties:
        slug:
          type: string
          description: The flow slug (ID-1).
        version:
          type: integer
          minimum: 1
          description: The version number, from 1 up (DF-2).
        contentHash:
          type: string
          description: >-
            The content hash of the frozen definition, in lowercase hex (DF-2).
        definition:
          type: object
          description: The frozen flow definition (DF-1, DF-2).
    Status:
      type: object
      description: >-
        The status line of an instance (VT-1, VT-2, S14): the position of the
        active step and the total, the current step and its holder, the state
        in plain language, and the steps a condition skipped.
      required: [step, totalSteps, state, skipped]
      properties:
        step:
          type: integer
          description: >-
            The 1-based position of the active step in the
            definition (VT-1).
        totalSteps:
          type: integer
          description: >-
            The number of steps in the definition (VT-1).
        currentStep:
          type: string
          description: >-
            The key of the active step (WF-1); absent when no step is open,
            because the instance is done or closed.
        holder:
          $ref: '#/components/schemas/ActorId'
        state:
          type: string
          description: The state in plain language (VT-2, S14).
          enum: [waiting, in-progress, done, withdrawn, cancelled]
        skipped:
          type: array
          description: >-
            The steps that a condition skipped, with the condition that
            skipped them (S05).
          items:
            type: object
            description: >-
              One skipped step and the JSON Logic condition that
              skipped it (S05, FM-5).
            required: [step, condition]
            properties:
              step:
                type: string
              condition:
                description: >-
                  The JSON Logic condition that skipped the step (FM-5).
    InstanceView:
      type: object
      description: >-
        The instance as one actor and the current step see it (#76, FM-3,
        FM-7, VT-4). The values hold only the field keys the current step makes
        visible, so a field the step hides is absent (FM-3 criterion 1).
      required: [instanceId, status, visible, editable, values]
      properties:
        instanceId:
          type: string
          description: The id of the instance the view describes (DX-1, #187).
        status:
          $ref: '#/components/schemas/Status'
        visible:
          type: array
          description: >-
            The field keys the current step makes visible, in
            definition order (FM-3).
          items:
            type: string
        editable:
          type: array
          description: >-
            The field keys the actor may edit on the current step (FM-3);
            empty when the actor is not an assignee of the step.
          items:
            type: string
        values:
          type: object
          description: >-
            The values the instance holds, restricted to the visible field
            keys (FM-3, FM-7).
          additionalProperties: true
    ApiError:
      type: object
      description: An error response, with a short machine-readable message.
      required: [error]
      properties:
        error:
          type: string
