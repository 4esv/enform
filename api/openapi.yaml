# The HTTP API contract (MVP.md 9.1, DX-1). The path prefix is /api/v1.
openapi: 3.1.0
info:
  title: enform
  version: 0.3.0
  description: >-
    The HTTP API of the enform engine. It appends operations to the
    append-only log and reads the log and the state rebuilt from it. A
    configuration change is an operation whose type is
    `config.<kind>.changed@1` (I14), not a separate endpoint. A request
    authenticates with the browser session cookie or with a bearer token, and
    both map to one principal and one session (ADR 0012).
servers:
  - url: /api/v1
security:
  - keycloak: []
  - cookieAuth: []
paths:
  /api/v1/operations:
    post:
      operationId: appendOperation
      summary: Append one operation to the log
      description: >-
        The engine applies the operation idempotently by its client-created
        ID (I1) and appends the event it records (I4). A client may post an
        intent instead of a resolved operation (ADR 0010). A start intent
        (`StartIntent`) names the flow and the values it collected and creates
        a private draft on the request form (ADR 0014); a draft edit
        (`DraftEditIntent`, `draft.edited@1`) names the draft and the values
        the starter changed; a submit intent (`SubmitIntent`,
        `instance.submitted@1`) names the draft, the version the starter read
        and the values the request form captured, and the server validates
        the request form, routes the instance and records the task-assigned
        emails through the engine (FM-4, SE-2); a
        completion intent (`CompletionIntent`) names the instance, the
        version it read, the outcome it chose and the values it captured. A
        claim (`step.claimed@1`) names the instance and the version it read as
        `expectedVersion`; the server applies it through the engine and
        records no `expectedVersion` on the log. A send-back intent
        (`SendBackIntent`, `step.sent-back@1`) names the instance, the earlier
        step it returns the task to, the required comment (WF-3) and the
        version it read; the server resolves it through the engine and
        records the revision on the log. A withdraw intent
        (`WithdrawIntent`, `instance.withdrawn@1`) names the instance, the
        reason and the version the starter read (S13, WF-4); a cancel intent
        (`CancelIntent`, `instance.cancelled@1`) does the same for a principal
        with `instance.cancel`, and its reason is required (S13, WF-4, AC-5);
        an undo intent (`UndoIntent`, `instance.undone@1`) names the instance
        and the version the closer read (S13, WF-5); a takeover intent
        (`TakeoverIntent`, `step.taken-over@1`) names the instance, the
        required reason and the version the assignee read, and the server
        measures the step's idle period from the claim on the log on its own
        clock (S10, AS-3); an undo of an action (`UndoActionIntent`,
        `event.undone@1`) names the instance, the seq of the event it undoes,
        the reason and the version it read, and the engine undoes the latest
        action only, within the flow's undo period, by its actor or a flow
        owner, and never past the flow's final step (S16, WF-5, D6); a
        release (`ReleaseIntent`, `task.released@1`) returns the task the
        holder holds, or any task for a flow owner with `task.reassign`, to
        the pool, and a reassign (`ReassignIntent`, `task.reassigned@1`) gives
        any task to a principal with a reason, for a flow owner only (WF-5,
        MVP.md 5.6). The server resolves the
        route, the transition, the assignees, the version stamp and the
        authorization through the engine before it appends. The intents are
        told apart by `type` and by their payload shape. The server refuses a
        stale close view before it calls the engine, because a withdraw or a
        cancel closes a task that is open now (I5). A
        `config.grant.changed@1` operation is the one configuration event this
        path serves: its payload names `principal`, `scopes` and `resource`,
        and the server authorizes `org.grants` on `org` or `flow.grant` on the
        resource before it appends the grant with the client's ID and time, so
        a retry with the same ID appends nothing; with `change: revoked` the
        same operation removes the named scopes of the principal on the
        resource and nothing else (AC-2). A `config.team.changed@1` intent
        (`TeamIntent`) creates a team, adds a member or removes one, for a
        principal with `org.teams` on `org` (AS-6). A raw start, a raw completion,
        a raw send back, a raw close or undo, any other configuration event or
        any other operation is refused. The appended event keeps the client's
        ID and time.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operation'
      responses:
        '201':
          description: The operation was appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: >-
            The operation is invalid, a raw `instance.started@1`,
            `instance.submitted@1`,
            `step.completed@1`, `step.sent-back@1`, `instance.withdrawn@1`,
            `instance.cancelled@1`, `instance.undone@1` or
            `step.taken-over@1` was posted instead of its intent, an intent
            cannot be resolved (an intent that lacks the instance id, the
            version, the reason, the target step or the comment, or that names
            an unknown instance), the engine refused a send back for an empty
            comment (WF-3), a cancel for a missing reason (MVP.md 5.6) or a
            takeover for a missing reason (AS-3), or a
            `config.grant.changed@1` lacks its id,
            time, principal, scopes or resource. Nothing is appended. A
            configuration event other than a grant is not served in this
            slice.
        '403':
          description: >-
            The principal may not make this change, or a state-changing cookie
            request carries no valid CSRF token. A grant requires `org.grants`
            on `org` or `flow.grant` on the resource. A withdraw requires the
            starter (AC-5), a cancel requires `instance.cancel` on the flow
            (S13, AC-5), and a takeover requires an assignee of the current
            step (AS-3). Nothing is appended.
        '409':
          description: >-
            The engine refused the submit, the draft edit, the completion,
            the claim, the send back, the
            withdraw, the cancel, the undo or the takeover and appended
            nothing (I1, I5), because the instance is not a draft or is a
            draft that nobody but its starter may act on (ADR 0014), the
            version the client read is stale,
            the actor does not hold the step (AS-2), does not hold the
            outcome's scope (AC-4), is not an assignee of the step (AS-3),
            the holder is not yet idle for the step's idle period (AS-3, the
            reason names the remaining time), the step does not allow a
            takeover (AS-3), is not the holder a send back needs (S11), is not
            the starter or the closer a close or an undo needs (S13, WF-4,
            WF-5), the undo period
            has passed (WF-5), captured a field the current step does not make
            editable (FM-3), or captured a value that fails its control or
            leaves a required field empty (FM-4). The `error` names the reason,
            and `errors` lists every validation error by field path; it is
            empty when the reason alone names the refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionRefusal'
  /api/v1/log:
    get:
      operationId: readLog
      summary: Read the append-only log
      description: >-
        The single sequence of all events, in one global order (I4), as the
        signed-in principal may read it (I8): the events of the instances it
        may read (its own, the ones it is assigned to, the flows it holds
        `instance.read` on; a draft stays private to its starter), the
        configuration changes of the flows it holds `instance.timeline` on,
        and everything with `org.grants` on `org`. `instance` keeps one
        instance's events and `limit` the newest ones (S16).
      parameters:
        - name: instance
          in: query
          required: false
          schema:
            type: string
          description: Only the events of this instance (DX-1).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Only the newest events, this many.
        - name: after
          in: query
          required: false
          description: >-
            Only the events after this log position (#260, RT-1): the polling
            fallback of the realtime channel reads what it missed.
          schema:
            type: integer
            minimum: 0
        - name: flow
          in: query
          required: false
          description: >-
            Only the events of this flow (#260, RT-1): its configuration
            changes and the events of its instances, as the person may read
            them (I8).
          schema:
            type: string
      responses:
        '200':
          description: The ordered events of the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
  /api/v1/realtime:
    get:
      operationId: realtime
      x-url-only: true
      summary: The realtime channel (WebSocket)
      description: >-
        The primary realtime transport (RT-1, DX-2, ADR 0006): a WebSocket
        upgrade on this path, authenticated like a request (the session
        cookie or a bearer token). The messages are `schemas/realtime/v1.json`:
        `hello` and `welcome` agree the protocol version, a subscription names
        one instance or one flow and is authorized when it opens (I8), a
        change carries the seq and the type of a new event and no payload,
        and presence travels both ways (RT-2). The client builds the URL from
        this operation and opens the socket itself.
      responses:
        '101':
          description: The connection switches to the WebSocket protocol.
        '401':
          description: There is no session.
  /api/v1/realtime/events:
    get:
      operationId: streamEvents
      x-url-only: true
      summary: Stream the changes of one instance or one flow (Server-Sent Events)
      description: >-
        The Server-Sent Events fallback of the realtime channel (RT-1, DX-2,
        ADR 0006). The stream names one instance or one flow, is authorized
        when it opens (I8), and sends `welcome`, then every `changed` and
        `presence` message of the scope as `schemas/realtime/v1.json`
        describes them, with a `ping` every 25 seconds. A change carries no
        payload: the client reads through the API. The WebSocket channel at
        `/api/v1/realtime` is the primary transport and carries presence both
        ways; it is not an HTTP operation and is described by the schema.
      parameters:
        - name: instance
          in: query
          required: false
          schema:
            type: string
        - name: flow
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: The stream names no scope, or two.
        '401':
          description: There is no session.
        '403':
          description: The person may not read the scope.
        '404':
          description: The log does not hold the instance.
  /api/v1/state:
    get:
      operationId: readState
      summary: Read the state rebuilt from the log
      description: >-
        The derived state is rebuilt from the log (I4), so it is reproducible
        from the same sequence of events. It is the organization's: the read
        needs `org.grants` on `org` (I8).
      responses:
        '403':
          description: The principal holds no `org.grants` on `org`.
        '200':
          description: The state rebuilt from the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /api/v1/flows/{slug}:
    get:
      operationId: readFlow
      summary: Read the published flow by slug
      description: >-
        The newest published version of the flow with this slug, derived from
        the append-only log (I4), or the version that `version` names, so a
        diff between two published versions reads both (DF-6, S15). An
        unknown slug or version answers 404.
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: The published version number to read; absent means the newest (DF-2).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The published version of the flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFlow'
        '404':
          description: No flow has this slug
  /api/v1/flows/{slug}/diff:
    get:
      operationId: readFlowDiff
      summary: Read the difference between two points of a flow's history
      description: >-
        The field-level difference from one point of the flow's history to
        another (DF-6, S03, S04): two published versions, or a version and
        the draft. Each change carries its path, its class, the value before
        and after, and the author and the time of the push that made it,
        read from the log (I4, I14). A point is a published version number
        or `draft`. `to` absent means the draft; `from` absent means the
        parent of `to`: the version before a version, the newest version
        before the draft. A version needs a flow read scope; the draft is the
        working copy, so a point at the draft needs `flow.read`, `flow.edit`
        or `flow.build` (I8). An unknown version answers 404.
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: The point the difference starts from; absent means the parent of `to`.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: The point the difference ends at; absent means the draft.
          schema:
            type: string
      responses:
        '200':
          description: The attributed difference between the two points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDiff'
        '400':
          description: A point is neither a positive version number nor `draft`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The principal may not read the flow, or the draft (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No flow has this slug, or it has no such version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/flows/{slug}/grants:
    get:
      operationId: readFlowGrants
      summary: Read a flow's grants
      description: >-
        The grants on the flow and its steps, in log order (AC-1, AC-2, I8,
        `MVP.md` 5.6): the flow-level grants and the step-level grants under
        the flow. This is the administrator's view that the builder reads to
        show and add starters, so the read requires `flow.grant` on the flow
        or `org.grants` on the organization. A flow with no grants answers an
        empty array.
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
      responses:
        '200':
          description: The grants on the flow and its steps, in log order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '403':
          description: >-
            The principal does not hold `flow.grant` on the flow or
            `org.grants` on the organization (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/instances/{instanceId}:
    get:
      operationId: readInstance
      summary: Read an instance as a step sees it
      description: >-
        The instance as one actor and the current step see it (FM-3, FM-7,
        VT-4, I8). The engine projects the instance from the append-only log
        (I4) and authorizes the read with the same rule as a write (AC-1): the
        starter, an assignee, or a principal that holds `instance.read` on the
        flow. The response holds the status line (VT-1, VT-2), the field keys
        the current step makes visible and editable (FM-3), the values the
        instance holds restricted to the visible keys, so a field the step
        does not make visible is absent from the response (FM-3 criterion 1),
        and the instance `version` that a client sends with a completion or a
        claim (I5). The session identifies the actor. `actor` stays as an
        optional harness compatibility seam; the production route authorizes
        with the session principal and ignores it. The view also carries
        `previousSteps`, the earlier definition keys that a send back may name
        (S11, WF-3), and `notes`, the notes on this instance that the actor
        may read (VT-3, I8). A closed instance carries `withdrawal`,
        `closeReason`, `closedAt`, `closedBy` and `undoUntil`, the end of the
        flow's undo period (S13, WF-4, WF-5); `canWithdraw` and `canCancel`
        tell the page whether to offer the close controls, and the engine
        still authorizes the write (A9, I8).
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The id of the instance (DX-1, #187).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: >-
            The harness compatibility seam (ADR 0012). The production route
            authorizes with the session principal and ignores this parameter,
            which the interface will stop sending when it uses sessions end to
            end.
          schema:
            type: string
      responses:
        '200':
          description: The instance as the actor and the current step see it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceView'
        '400':
          description: The actor query parameter is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The actor may not read the instance (I8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The log holds no such instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/instances/{instanceId}/pdf:
    get:
      operationId: instancePdf
      summary: Render an instance as a PDF for a step
      description: >-
        The instance as a given step sees it, with the step history, as a PDF
        (OU-1, I8). The read is the instance read through the engine's rules:
        the same `mayRead` authorization answers 403 to a principal that may
        not read the instance, and the form holds only the fields the step
        makes visible and only the values the actor may read (FM-3, I8). The
        tracker states and the instance's timeline are the step history
        (VT-2, VT-5, I4), and a connector call shows its operation, time and
        outcome and never a response body (I13). The current step is the
        default; `step` renders the form of another step of the pinned
        definition with the same rules, while the history stays the
        instance's. The response is a PDF with a filename that names the
        instance and the step. A cleared or unknown instance answers 404 and
        an unknown step answers 404.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The id of the instance (DX-1, #187).
          schema:
            type: string
        - name: step
          in: query
          required: false
          description: >-
            The definition key of the step whose form the PDF shows (OU-1).
            An absent value renders the current step, or the closed state
            when no step is open.
          schema:
            type: string
      responses:
        '200':
          description: The instance as the step sees it, with its step history
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: The principal may not read the instance (I8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >-
            The log holds no such instance, or the definition holds no such
            step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/instances/{instanceId}/timeline:
    get:
      operationId: readInstanceTimeline
      summary: Read an instance's timeline
      description: >-
        The instance's own events in log order (I4, VT-5): the instance
        started, the submit, the claims, the completions, the send backs and
        the closes, each with its actor and time. The read authorizes the
        instance events with `mayRead` (I8), the same rule as the instance
        read. With `includeChanges` it adds the configuration changes of the
        instance's flow, in the same order, and only when the actor holds
        `instance.timeline` on that flow; without the scope the request is
        refused with 403, so a subscriber never sees an event it may not see
        (I8). The response is `TimelineEntry[]` in the one global order of I4.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The id of the instance (DX-1, #187).
          schema:
            type: string
        - name: includeChanges
          in: query
          required: false
          description: >-
            `1` adds the configuration changes of the instance's flow beside
            the instance's own events (VT-5). It requires `instance.timeline`
            on the flow (I8).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: >-
            The harness compatibility seam (ADR 0012). The production route
            authorizes with the session principal and ignores this parameter,
            exactly as the instance read does.
          schema:
            type: string
      responses:
        '200':
          description: The instance's timeline, in log order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEntry'
        '403':
          description: >-
            The actor may not read the instance, or asked for the flow's
            configuration changes without `instance.timeline` on the flow (I8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The log holds no such instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/timeline:
    get:
      operationId: readTimeline
      summary: Read the global change feed
      description: >-
        The change feed of VT-6: the log in one global order (I4), filterable
        by flow slug and by event type. It requires `instance.timeline` on the
        named flow or `org.grants` on the organization, so an administrator or
        a flow owner reads it and a requester without the scope answers 403
        (I8). An entry carries its actor (I14), the flow when the event names
        one, the step and the comment when the payload carries them, and the
        operation, time and outcome of a connector call (I13).
      parameters:
        - name: flow
          in: query
          required: false
          description: Keep the entries of this flow slug (VT-6).
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Keep the entries of this versioned event type (VT-6).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: >-
            The harness compatibility seam (ADR 0012). The production route
            authorizes with the session principal and ignores this parameter.
          schema:
            type: string
      responses:
        '200':
          description: The change feed, in log order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEntry'
        '403':
          description: >-
            The principal does not hold `instance.timeline` on the flow or
            `org.grants` on the organization (I8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    get:
      operationId: login
      summary: Start a sign-in
      description: >-
        Answers 302 to the identity provider's authorization endpoint, with the
        state and the PKCE challenge of this attempt (ID-1, ID-2, ADR 0012).
        The request creates no session; the callback creates it. `returnTo` is
        the relative path that the visitor came from, so the sign-in puts the
        browser back on the same location (ID-2).
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: >-
            The relative path to return to after the sign-in (ID-2). The server
            keeps it with the state of this attempt, because the callback
            cannot trust a value that a caller could change.
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to the identity provider. The `Location` header names its
            authorization endpoint with the state and the PKCE challenge
            (ADR 0012).
          headers:
            Location:
              description: >-
                The identity provider's authorization endpoint (ADR 0012).
              schema:
                type: string
  /api/v1/auth/callback:
    get:
      operationId: authCallback
      summary: Finish a sign-in
      description: >-
        The identity provider redirects here with the code and the state of an
        attempt that `login` started. The server exchanges the code, validates
        the issuer, the audience, the nonce, the signature through the JWKS and
        the expiry, creates the session row in PostgreSQL, rotates the session
        id and sets the `enform_session` cookie, then answers 302 to the
        `returnTo` that the attempt recorded (ID-1, ID-2, ADR 0012). A failed
        exchange answers 401 and creates no session.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: >-
            The authorization code that the identity provider issued (ADR 0012).
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: >-
            The state of the attempt that `login` started; it names the stored
            PKCE verifier and the recorded `returnTo` (ADR 0012).
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to the recorded `returnTo`, with the session cookie set
            (ID-2, ADR 0012).
          headers:
            Location:
              description: The relative path that the sign-in returns to (ID-2).
              schema:
                type: string
            Set-Cookie:
              description: >-
                The `enform_session` cookie, `HttpOnly`, `Secure` and
                `SameSite=Lax` (ADR 0012).
              schema:
                type: string
        '401':
          description: >-
            The code exchange failed, so no session exists and no cookie is set
            (ADR 0012).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: >-
        Revokes the session row and ends the identity provider session, so the
        cookie stops authenticating at once and a deprovisioned user cannot
        continue (ADR 0012, ID-5). The request carries the session cookie and
        the CSRF token that `readSession` returned, and the response is 204
        with no body.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: >-
            The session and the identity provider session are revoked; no body.
        '401':
          description: There is no session to end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/cli:
    get:
      operationId: readCliAuth
      summary: Describe the device sign-in of the CLI
      description: >-
        Which identity provider and which client the `enform` CLI signs in
        with (DX-3, S01). The CLI requests a device code at the device
        authorization endpoint, shows the person the verification URL and the
        user code, and polls the token endpoint until the person approved
        (RFC 8628). The answer is public, because a sign-in has no credential
        yet, and it names no secret: the CLI client is a public client.
      security: []
      responses:
        '200':
          description: The client id and the two endpoints of the device flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuth'
  /api/v1/session:
    get:
      operationId: readSession
      summary: Read the signed-in principal
      description: >-
        The principal of the current session, the absolute expiry and the CSRF
        token that a state-changing request carries (ADR 0012). The principal
        id is the identity provider's subject: it is the immutable ID that a
        grant names, never a name or an email address (ID-4). The browser and
        the CLI read the same session through this path, because the cookie and
        the bearer token map to one principal and one session row (ADR 0012).
      responses:
        '200':
          description: >-
            The principal, the expiry and the CSRF token of the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: >-
            There is no session; the caller signs in first (ID-2, ADR 0012).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: List the teams and their members
      description: >-
        The teams that `org.teams` holders created and maintain, with the
        members they hold now (AS-6, AS-4). They are a projection of the
        `config.team.changed@1` events on the log (I4, I14). Any signed-in
        principal may read them, because a step target names a team by its
        name. A team is changed by posting a `TeamIntent` to `/operations`.
      responses:
        '200':
          description: The teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          description: There is no session.
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List the directory users
      description: >-
        The users of the built-in directory with the status of each one, so an
        administrator sees whom an installation holds before it federates
        (ID-6, ADR 0012). The read requires `org.grants` on `org`, the
        organization-administration scope of `MVP.md` 5.6, because the
        directory is an administrator surface (ID-6).
      responses:
        '200':
          description: The users of the local directory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryUser'
        '403':
          description: >-
            The principal does not hold `org.grants` on the organization (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createUser
      summary: Create a directory user
      description: >-
        Creates the user in the local directory through the identity provider's
        admin API with the dedicated service account, because enform stores no
        credentials (ID-6, ADR 0012). With `sendInvite: false` the user is
        enabled and email-verified with a generated strong temporary password
        and no required action, so the password signs the user in immediately;
        the password appears once in the `CreatedUser` response, and the server
        logs it never. `sendInvite: true` answers 409 `mail-not-configured`
        because the mail transport is not configured in this slice, and then
        nothing is created. There is no self-signup (ID-6, DE-1). The request
        requires `org.grants` on `org` (I8, `MVP.md` 5.6).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: >-
            The user exists in the directory. `temporaryPassword` is the
            generated credential, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          description: >-
            The body is malformed: it needs an email address, a display name
            and `sendInvite`, and the groups must be strings. Nothing is
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: >-
            The principal does not hold `org.grants` on the organization (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            The directory already holds this email address, and a second user
            is not created (ID-4, ID-6); or `sendInvite` asks for a mail that
            this installation cannot send, with the code
            `mail-not-configured`, and nothing is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/groups:
    get:
      operationId: listGroups
      summary: List the directory groups
      description: >-
        The groups of the built-in directory and the members each one holds
        (ID-6, AS-1). The group id is the principal that a `group` target and a
        grant to a group name, so the administrator reads who a group task
        reaches before it is published (I10). The read requires `org.grants`
        on `org`, the organization-administration scope of `MVP.md` 5.6,
        because the directory is an administrator surface (ID-6, I8).
      responses:
        '200':
          description: The groups of the local directory and their members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryGroup'
        '403':
          description: >-
            The principal does not hold `org.grants` on the organization (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/flows:
    get:
      operationId: listFlows
      summary: List the flows
      description: >-
        One summary per flow of the installation, which is the builder's
        starting point from the empty get-started page (DF-1, DE-4). It reuses
        the engine's flow state: the draft version is the version the current
        draft would publish as, and the published version is the newest
        immutable version (DF-2, DF-4).
      responses:
        '200':
          description: The flows of the installation, newest activity first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowSummary'
    post:
      operationId: createFlow
      summary: Create a flow
      description: >-
        Creates a flow with this slug and an empty draft (DF-1, DF-4). The slug
        names the flow in its path and in a grant resource, so a slug that
        exists answers 409 and creates nothing (`MVP.md` 5.6). The request
        requires `flow.build` on the new flow, because the first draft of a
        flow is structural (DF-5, D2).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlow'
      responses:
        '201':
          description: The new flow with its empty draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftFlow'
        '403':
          description: >-
            The principal does not hold `flow.build` on the new flow (DF-5, I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            A flow already has this slug, and nothing is created (DF-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/flows/{slug}/draft:
    get:
      operationId: readDraft
      summary: Read the draft definition
      description: >-
        The draft that the builder edits, with the version it is based on
        (DF-1, DF-4, I5). The draft is the working copy of the people who may
        change the flow, so the read requires `flow.read`, `flow.edit` or
        `flow.build` on it (DF-3, DF-5, I8). A flow whose draft is still empty
        answers 404, because a definition needs at least one step
        (`schemas/flow/v2.json`).
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
      responses:
        '200':
          description: The draft definition and the version it is based on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftFlow'
        '403':
          description: The principal may not change this flow (DF-5, I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >-
            No flow has this slug, or its draft is still empty (DF-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: writeDraft
      summary: Write the draft definition
      description: >-
        Records an edit of the draft. The write is an engine change, not a file
        write: the server parses the definition (`schemas/flow/v2.json`), diffs
        it against the current draft, classifies every change as edit-class or
        structural (DF-3, DF-5) and appends the attributed operations that
        record it (I14). `version` is the draft version the client based the
        edit on, so a stale write is refused with 409 and appends nothing (I5),
        and the client re-reads and retries (A1). `baseHash` names the draft
        the edit is based on, so two people editing at the same time are
        merged instead of blocked (DF-3, S03): a place only one side changed
        lands, and a place both changed differently answers 409 with the
        conflicting paths. A definition that the schema rejects answers 422
        with every error by path, and nothing is appended (DF-1, A9).
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftWrite'
      responses:
        '200':
          description: The draft after the write, with the changes it made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftFlow'
        '403':
          description: >-
            The principal does not hold the scope that the classified change
            needs: `flow.build` for a structural change, `flow.edit` or
            `flow.build` for an edit-class change (DF-5, D2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No flow has this slug (DF-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            The version is stale, or the write named a `baseHash` and the
            merge with the current draft found a place both changed
            differently: `conflicts` names each such path (DF-3, S03). Either
            way this write appends nothing and the client re-reads (I5, A1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: >-
            The definition is not valid, and `errors` lists every failure by
            path (DF-1, FM-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/flows/{slug}/dry-run:
    post:
      operationId: dryRunFlow
      summary: Run a version or the draft of a flow as a dry run
      description: >-
        A dry run of any published version or of the draft (DR-1) with the
        given data: the route with the steps a condition skipped and their
        conditions (S05), who each active step resolves to and through which
        target (S08, AS-1), the assignment emails of the next step as the
        preview inbox (DR-3), and, with the simulated clock moved forward,
        the reminders and the escalation that step fires by then (DR-4, S12).
        The run writes no event and sends nothing (A6, I7). It needs
        `flow.dryrun`, `flow.edit` or `flow.build` on the flow. Running as
        another person needs `org.impersonate` on `org`, and the log records
        each such use as `dryrun.ran@1` (DR-5, I14); nothing else of a dry
        run is stored (DR-6).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
      responses:
        '200':
          description: The dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          description: The body names no data, or a version that is neither a number nor `draft`.
        '401':
          description: There is no session.
        '403':
          description: The person may not dry-run the flow, or may not run as another person.
        '404':
          description: No flow has the slug, or the version is not published, or the draft is empty.
  /api/v1/flows/{slug}/publish:
    post:
      operationId: publishFlow
      summary: Publish the draft
      description: >-
        Freezes the draft into the next immutable version with its content
        hash, and answers the published version (DF-2, VT-6). An instance stays
        on the version that it started on, so publishing changes no running
        instance (I13). `version` names the draft version that the client
        publishes, so a stale version answers 409 and publishes nothing (I5).
        The request needs `flow.build`, or `flow.edit` when the change since
        the last publication is edit-class only (DF-5, D2); the engine
        classifies the change and decides, so the client names no scope.
      parameters:
        - name: slug
          in: path
          required: true
          description: The flow slug (ID-1).
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDraft'
      responses:
        '200':
          description: The new immutable version of the flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFlow'
        '403':
          description: >-
            The principal does not hold the scope that the change needs
            (DF-5, I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >-
            No flow has this slug, or its draft is still empty (DF-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            The version is stale, so this publication writes nothing and the
            client re-reads (I5, A1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: >-
            The draft is not a valid definition, and `errors` lists every
            failure by path (DF-1, FM-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/inbox:
    get:
      operationId: readInbox
      summary: Read the inbox
      description: >-
        The tasks of one tab of the inbox: the tasks that the principal holds,
        the tasks that it may claim, or the instances that it started (VT-1).
        An item shows one step of one instance with its state, its holder, its
        due time and the last activity on it (VT-2), so the reader sees whether
        nobody has opened the task yet, who holds it, and how long it sits
        there (AS-2, S14). The engine authorizes every item: a task appears
        only when the principal is a target of its step, its holder, or the
        starter (AS-2, AC-5, I8).
      parameters:
        - name: tab
          in: query
          required: false
          description: >-
            The tab to read: `my` (the tasks the principal holds), `available`
            (the tasks it may claim) or `started` (the instances it started)
            (VT-1).
          schema:
            type: string
            enum: [my, available, started]
            default: my
      responses:
        '200':
          description: The tasks of the tab, in the engine's order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxItem'
  /api/v1/unroutable:
    get:
      operationId: listUnroutable
      summary: Read the Unroutable queue
      description: >-
        The open tasks whose targets resolved to nobody (I10, AS-5). The flow
        owner reads the queue and receives the `send-unroutable` alert that the
        start or the completion recorded in the same operation (SE-2). The
        server authorizes every row against `task.reassign` on the flow or
        `org.grants` on the organization, so no other principal reads it (I8).
      responses:
        '200':
          description: The open unroutable tasks, newest activity first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnroutableItem'
        '403':
          description: >-
            The principal holds neither `task.reassign` on the flow nor
            `org.grants` on the organization (I8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    CsrfToken:
      name: x-csrf-token
      in: header
      required: false
      description: >-
        The token that `readSession` returned. A state-changing request with a
        cookie session carries it, so a page from another origin cannot act as
        the principal (ADR 0012). The bearer path is exempt, so this parameter
        is optional and the server refuses a cookie request without it.
      schema:
        type: string
  securitySchemes:
    keycloak:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Keycloak access token (ADR 0005). The CLI presents it, and the server
        maps it to the same principal and the same session row as the browser
        cookie (ADR 0012).
    cookieAuth:
      type: apiKey
      in: cookie
      name: enform_session
      description: >-
        The browser credential: the server-side session cookie, `HttpOnly`,
        `Secure` and `SameSite=Lax`, that names a session row in PostgreSQL
        (ADR 0012). Logout and deprovisioning revoke the row, so the cookie
        stops authenticating at once (ID-5). A state-changing request also
        carries the CSRF token that `readSession` returns (ADR 0012).
  schemas:
    ActorId:
      type: string
      description: >-
        An immutable directory ID that identifies a person or a group (ID-4).
        A name or an email address never identifies a principal.
    Grant:
      type: object
      description: >-
        One grant (`MVP.md` 5.6, AC-1): a principal, the scopes it holds and
        the resource they apply to. The principal is a user, a group or a team
        (ID-4); the resource is `org`, `flow:<slug>` or
        `flow:<slug>/step:<key>`, and a grant on a flow covers all of its
        steps.
      required: [principal, scopes, resource]
      properties:
        principal:
          $ref: '#/components/schemas/ActorId'
        scopes:
          type: array
          items:
            type: string
          description: >-
            The scopes the principal holds, for example `instance.start` or
            `step.outcome:approve` (AC-4).
        resource:
          type: string
          description: >-
            What the grant applies to: `org`, `flow:<slug>` or
            `flow:<slug>/step:<key>` (`MVP.md` 5.6).
    OperationId:
      type: string
      description: The client-created ID of one operation (UUIDv7).
    Operation:
      type: object
      description: One change (MVP.md 3). The client creates its ID (ADR 0004).
      required: [id, type, at, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: >-
            The versioned event type that this operation records (MVP.md 9.1).
            A configuration change uses `config.<kind>.changed@1` (I14).
          examples:
            - config.grant.changed@1
            - config.team.changed@1
            - config.connector.changed@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The change payload.
    StartIntent:
      type: object
      description: >-
        A start intent (ADR 0010): the parts a client can honestly send on
        the write path. It carries the operation ID and the instance ID it
        chose (I1, DX-1), the event type `instance.started@1`, the actor, and
        the flow and values it collected (FM-7). The server resolves the
        route, the assignees and the version stamp through the engine before
        it appends, so the client names no step and no assignee.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.started@1`.
          examples:
            - instance.started@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The flow, the instance ID and the values the client collected
            (DX-1, FM-7).
          required: [flow, instanceId, values]
          properties:
            flow:
              type: string
              description: The flow slug (ID-1).
            instanceId:
              type: string
              description: >-
                The ID that identifies the instance, minted by the client
                (DX-1). It is not the operation ID: the operation ID names one
                change, the instance ID names the instance the change acts on.
            values:
              type: object
              description: >-
                The values that the form holds: one field key to one JSON
                value (FM-7).
              additionalProperties: true
    SubmitIntent:
      type: object
      description: >-
        A submit intent (ADR 0010, ADR 0014, FM-4, FM-7, SE-2): the parts the
        starter can honestly send to submit a draft. It carries the operation
        ID it chose (I1), the event type `instance.submitted@1`, the actor,
        the draft it acts on (DX-1), the version the starter read (I5) and the
        values the request form captured. The server validates the request
        form's fields and rules, routes the instance to the next step whose
        skip condition is false, records the assignees and the task-assigned
        emails through the engine, and refuses a submit that is not the
        starter's, that is stale, or whose values fail (409 with every error by
        path). It is told apart from a resolved `instance.submitted@1` by the
        payload: an intent names no `step`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.submitted@1`.
          examples:
            - instance.submitted@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The draft, the version the starter read and the captured values.
          required: [instanceId, version]
          properties:
            instanceId:
              type: string
              description: The ID of the draft that is submitted (DX-1).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version the starter read (I5). A stale version is
                refused and appends nothing.
            values:
              type: object
              description: >-
                The values the request form captured, merged over what the
                draft holds (FM-7). Absent means the draft's values as they are.
              additionalProperties: true
    DraftEditIntent:
      type: object
      description: >-
        A draft edit (ADR 0014, RT-3, I1): the starter changed the values a
        draft holds. One operation per edit, with the ID the client chose, so
        a retry appends nothing. The values merge over what the draft holds;
        the submit validates them (FM-4). A principal that is not the starter
        answers 403, and an instance that is no longer a draft answers 409.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `draft.edited@1`.
          examples:
            - draft.edited@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The draft and the values the edit changed.
          required: [instanceId, values]
          properties:
            instanceId:
              type: string
              description: The ID of the draft the edit acts on (DX-1).
            values:
              type: object
              description: The field keys the edit changed, each with its new value (FM-7).
              additionalProperties: true
    UndoActionIntent:
      type: object
      description: >-
        An undo of an action (S16, S10, WF-5, D6, A2): the parts a client can
        honestly send to undo the latest claim, release, takeover, reassign,
        outcome or send back on an instance. It carries the operation ID it
        chose (I1), the event type `event.undone@1`, the actor, the instance,
        the seq of the event it undoes (from the timeline), the reason and the
        version it read (I5). The engine appends a compensating event and
        never rewrites the undone one; a side effect that already occurred is
        marked Already sent and not reversed, and its recipients are notified.
        A principal who neither made the action nor owns the flow answers 403;
        a stale view, an event that is not the latest action, an undo after
        the flow's period or past its final step answers 409 with the reason.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `event.undone@1`.
          examples:
            - event.undone@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The instance, the event, the reason and the version read.
          required: [instanceId, eventId, reason, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance the undone event acted on (DX-1).
            eventId:
              type: integer
              minimum: 1
              description: The seq of the event to undo, as the timeline shows it (I4).
            reason:
              type: string
              description: Why the actor undoes it (WF-5).
            version:
              type: integer
              minimum: 0
              description: The instance version the client read (I5).
    Team:
      type: object
      description: One team and the members it holds now (AS-6, AS-4, ID-4).
      required: [name, members]
      properties:
        name:
          type: string
          description: The team name, the principal ID a `team` target names (ID-4).
        members:
          type: array
          description: The user and group IDs the team holds now, in the order they joined.
          items:
            type: string
    TeamIntent:
      type: object
      description: >-
        A team change (AS-6, I14): the parts a client sends to create a team,
        add a member or remove one. It carries the operation ID (I1), the type
        `config.team.changed@1`, the actor, the team name, the change and, for
        a membership change, the member. The engine authorizes `org.teams` on
        `org` (403 otherwise), refuses a team that already exists or does not
        exist (409) and a malformed change (400).
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `config.team.changed@1`.
          examples:
            - config.team.changed@1
        at:
          type: number
          description: Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          required: [team, change]
          properties:
            team:
              type: string
              description: The team name (ID-4).
            change:
              type: string
              enum: [created, member-added, member-removed]
            member:
              type: string
              description: The user or group ID the change adds or removes (ID-4).
    ReleaseIntent:
      type: object
      description: >-
        A release (WF-5, AS-2, I5): the holder returns the task of the current
        step to the pool, or a flow owner with `task.reassign` on the flow
        returns anyone's with a reason. It carries the operation ID (I1), the
        type `task.released@1`, the actor, the instance and the version read.
        A principal who neither holds the task nor owns the flow answers 403;
        a task nobody holds or a stale view answers 409.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `task.released@1`.
          examples:
            - task.released@1
        at:
          type: number
          description: Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          required: [instanceId, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance whose task is released (DX-1).
            version:
              type: integer
              minimum: 0
              description: The instance version the client read (I5).
            reason:
              type: string
              description: Why a flow owner releases the task; optional for the holder.
    ReassignIntent:
      type: object
      description: >-
        A reassign (WF-5, MVP.md 5.6, I2, I5): a flow owner with
        `task.reassign` on the flow gives the task of the current step to a
        principal, with a reason. The principal becomes the holder and an
        assignee of the step and is told in the same operation (SE-2). It
        carries the operation ID (I1), the type `task.reassigned@1`, the actor,
        the instance, the version read, the principal and the reason. A
        principal without `task.reassign` answers 403; a stale view answers
        409; a missing reason or principal answers 400.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `task.reassigned@1`.
          examples:
            - task.reassigned@1
        at:
          type: number
          description: Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          required: [instanceId, version, to, reason]
          properties:
            instanceId:
              type: string
              description: The ID of the instance whose task is reassigned (DX-1).
            version:
              type: integer
              minimum: 0
              description: The instance version the client read (I5).
            to:
              $ref: '#/components/schemas/ActorId'
            reason:
              type: string
              description: Why the owner reassigns the task (WF-5).
    CompletionIntent:
      type: object
      description: >-
        A completion intent (ADR 0010, FM-3, FM-4): the parts a client can
        honestly send when the holder completes the current step. It carries
        the operation ID it chose (I1), the event type `step.completed@1`,
        the actor, the instance it acts on (DX-1), the version of the instance
        it read (I5), the outcome the actor chose (AC-4) and the values the
        step captured (FM-7). The server resolves the current step, the
        transition, the outcome's authorization and the editability of every
        captured field through the engine before it appends, so the client
        names no step. It is told apart from an already resolved
        `step.completed@1` operation by the payload: an intent names no
        `step`, a resolved operation carries it. The `/operations` description
        also covers a claim: a `step.claimed@1` intent carries the instance
        and the version it read as `expectedVersion`, and the server applies
        it through the engine and records no `expectedVersion` on the log.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `step.completed@1`.
          examples:
            - step.completed@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the outcome the actor chose and the values the step
            captured (DX-1, FM-7).
          required: [instanceId, version, outcome, values]
          properties:
            instanceId:
              type: string
              description: >-
                The ID of the instance whose current step is completed
                (DX-1, #187).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The engine
                refuses the completion when the version is stale and appends
                nothing.
            outcome:
              type: string
              description: >-
                The outcome the actor chose for the current step (AC-4). The
                engine authorizes it from the actor's grants.
            values:
              type: object
              description: >-
                The values the step captured: one field key to one JSON value
                (FM-7). The engine refuses a key the current step does not
                make editable (FM-3, FM-4).
              additionalProperties: true
    SendBackIntent:
      type: object
      description: >-
        A send-back intent (S11, WF-3, AC-4): the parts a client can honestly
        send when the holder returns the current step to an earlier one. It
        carries the operation ID it chose (I1), the event type
        `step.sent-back@1`, the actor, the instance it acts on (DX-1), the
        earlier step it returns the task to, the required comment (WF-3) and
        the version of the instance it read (I5). The server calls the engine
        with the session principal and appends what the engine decided; it
        records no `version` on the log. It is told apart from an already
        resolved `step.sent-back@1` operation by the payload: a resolved
        operation carries `from` and `revision`, an intent names `version`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `step.sent-back@1`.
          examples:
            - step.sent-back@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the earlier step, the comment and the version the
            client read (DX-1, WF-3).
          required: [instanceId, to, comment, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance the send back acts on (DX-1).
            to:
              type: string
              description: >-
                The key of the earlier step the instance returns to (WF-3).
                The instance read lists the possible keys as `previousSteps`.
            comment:
              type: string
              description: >-
                The note that the target step's people read (WF-3). The
                engine refuses a blank comment.
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The engine
                refuses a send back from a stale view and appends nothing.
    WithdrawIntent:
      type: object
      description: >-
        A withdraw intent (S13, WF-4, AC-5): the parts a client can honestly
        send when the starter withdraws their own instance. It carries the
        operation ID it chose (I1), the event type `instance.withdrawn@1`,
        the actor, the instance it acts on (DX-1), the reason (which may be
        empty) and the version it read (I5). The server calls the engine with
        the session principal and appends what the engine decided; it records
        no `version` on the log. It is told apart from an already resolved
        `instance.withdrawn@1` operation by the payload: a resolved operation
        carries the engine's `step`, `holder` and `outbox` fields, an intent
        names `version`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.withdrawn@1`.
          examples:
            - instance.withdrawn@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the reason and the version the client read (DX-1,
            S13).
          required: [instanceId, reason, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance to withdraw (DX-1).
            reason:
              type: string
              description: >-
                The reason the starter gives, which may be empty (S13).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The server
                refuses a stale close and appends nothing.
    CancelIntent:
      type: object
      description: >-
        A cancel intent (S13, WF-4, AC-1, AC-5): the parts a client can
        honestly send when a principal with `instance.cancel` cancels an
        instance. It carries the operation ID it chose (I1), the event type
        `instance.cancelled@1`, the actor, the instance it acts on (DX-1), the
        required reason and the version it read (I5). The server calls the
        engine with the session principal and grants and appends what the
        engine decided; it records no `version` on the log. It is told apart
        from an already resolved `instance.cancelled@1` operation by the
        payload: a resolved operation carries the engine's `step`, `holder`
        and `outbox` fields, an intent names `version`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.cancelled@1`.
          examples:
            - instance.cancelled@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the reason and the version the client read (DX-1,
            S13).
          required: [instanceId, reason, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance to cancel (DX-1).
            reason:
              type: string
              minLength: 1
              description: >-
                The reason the cancelling principal gives, which is required
                (MVP.md 5.6, S13).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The server
                refuses a stale close and appends nothing.
    TakeoverIntent:
      type: object
      description: >-
        A takeover intent (S10, AS-3, WF-5): the parts a client can honestly
        send when an assignee takes a claimed task over from another assignee
        after the step's idle period. It carries the operation ID it chose
        (I1), the event type `step.taken-over@1`, the actor, the instance it
        acts on (DX-1), the required reason and the version it read (I5). The
        server calls the engine with the session principal, the idle period
        that the pinned definition sets and the server clock, and appends what
        the engine decided; it records no `version` on the log. It is told
        apart from an already resolved `step.taken-over@1` operation by the
        payload: a resolved operation carries `step`, `from`, `to`, `when`,
        `why` and `outbox`, an intent names `version`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `step.taken-over@1`.
          examples:
            - step.taken-over@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6). It
            stamps the operation; the engine measures the idle period on the
            server clock, so this time cannot shorten it.
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: >-
            The instance, the required reason and the version the client read
            (DX-1, AS-3).
          required: [instanceId, reason, version]
          properties:
            instanceId:
              type: string
              description: >-
                The ID of the instance whose task is taken over (DX-1).
            reason:
              type: string
              minLength: 1
              description: >-
                The reason the taking principal gives, which is required
                (AS-3).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The engine
                refuses a takeover from a stale view and appends nothing.
    UndoIntent:
      type: object
      description: >-
        An undo intent (S13, WF-5, I4): the parts a client can honestly send
        when the actor who withdrew or cancelled an instance undoes it. It
        carries the operation ID it chose (I1), the event type
        `instance.undone@1`, the actor, the instance it acts on (DX-1) and the
        version it read (I5). The server calls the engine with the session
        principal and the flow's undo period; the engine accepts only the
        closer and only within the period, and appends a compensating event
        that never rewrites the close. It is told apart from an already
        resolved `instance.undone@1` operation by the payload: a resolved
        operation carries the engine's `undoOf`, `step` and `holder` fields,
        an intent names `version`.
      required: [id, type, at, actor, payload]
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type, `instance.undone@1`.
          examples:
            - instance.undone@1
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The instance and the version the client read (DX-1, S13).
          required: [instanceId, version]
          properties:
            instanceId:
              type: string
              description: The ID of the instance to reopen (DX-1).
            version:
              type: integer
              minimum: 0
              description: >-
                The instance version that the client read (I5). The engine
                refuses a stale undo and appends nothing.
    Event:
      type: object
      description: >-
        An immutable, ordered record of an occurrence. The single writer
        assigns `seq` (ADR 0004).
      required: [seq, operationId, type, at, payload]
      properties:
        seq:
          type: integer
          minimum: 1
          description: The 1-based position in the append-only log.
        operationId:
          $ref: '#/components/schemas/OperationId'
        type:
          type: string
          description: The versioned event type that this event records.
        at:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        payload:
          type: object
          description: The change payload.
    Log:
      type: array
      description: The single sequence of all events, in one global order.
      items:
        $ref: '#/components/schemas/Event'
    State:
      type: object
      description: The derived state, rebuilt from the log (I4).
      required: [applied, log]
      properties:
        applied:
          type: array
          description: The IDs of the operations that have been applied.
          items:
            $ref: '#/components/schemas/OperationId'
        log:
          $ref: '#/components/schemas/Log'
    PublishedFlow:
      type: object
      description: >-
        One published version of a flow, read by its slug (DF-2). The version
        is immutable and the definition is frozen.
      required: [slug, version, contentHash, definition]
      properties:
        slug:
          type: string
          description: The flow slug (ID-1).
        version:
          type: integer
          minimum: 1
          description: The version number, from 1 up (DF-2).
        contentHash:
          type: string
          description: >-
            The content hash of the frozen definition, in lowercase hex (DF-2).
        definition:
          type: object
          description: The frozen flow definition (DF-1, DF-2).
    TimelineCall:
      type: object
      description: >-
        One connector call as the timeline shows it (I13): the operation that
        ran, the time and the outcome. It never carries a response body.
      required: [operation, time, outcome]
      properties:
        operation:
          type: string
          description: The connector operation that ran (I13).
        time:
          type: integer
          description: The time of the call, from the injected clock (I6).
        outcome:
          type: string
          description: >-
            What the call resulted in, an outcome and never a response body
            (I13).
    TimelineEntry:
      type: object
      description: >-
        One entry of the timeline (VT-5, S15, #246). It is one event of the log
        in the one global order (I4): instance events and configuration changes
        share it, so no two entries have an ambiguous order and `seq` is the
        position. The entry carries the actor of the change (I14), the flow
        when the event names one (VT-6), the step and comment when the payload
        carries them, and the connector call when the event records one (I13).
      required: [seq, at, type]
      properties:
        seq:
          type: integer
          description: The position of the event in the log (I4).
        at:
          type: integer
          description: The time of the event, from the injected clock (I6).
        actor:
          $ref: '#/components/schemas/ActorId'
        type:
          type: string
          description: The versioned event type (MVP.md 9.1).
        flow:
          type: string
          description: >-
            The slug of the flow that the entry belongs to, when the event
            names one (VT-6).
        step:
          type: string
          description: >-
            The step key that the payload carries, when it carries one (VT-5,
            VT-6). A send back names the step it reopens.
        comment:
          type: string
          description: >-
            The comment that the payload carries, for a note or a send back
            (VT-5, VT-6).
        reason:
          type: string
          description: >-
            The reason that the payload carries, when the event records one
            (VT-5, WF-5): why a task was released, reassigned or taken over,
            why an instance was withdrawn or cancelled, or why an action was
            undone. A release made by a deprovision says that the holder was
            deprovisioned (ID-5, #267).
        call:
          $ref: '#/components/schemas/TimelineCall'
    Status:
      type: object
      description: >-
        The status line of an instance (VT-1, VT-2, S14): the position of the
        active step and the total, the current step and its holder, the state
        in plain language, and the steps a condition skipped.
      required: [step, totalSteps, state, skipped]
      properties:
        step:
          type: integer
          description: >-
            The 1-based position of the active step in the
            definition (VT-1).
        totalSteps:
          type: integer
          description: >-
            The number of steps in the definition (VT-1).
        currentStep:
          type: string
          description: >-
            The key of the active step (WF-1); absent when no step is open,
            because the instance is done or closed.
        holder:
          $ref: '#/components/schemas/ActorId'
        state:
          type: string
          description: >-
            The state in plain language (VT-2, S14). A draft is an instance
            its starter has not submitted (ADR 0014).
          enum: [draft, waiting, in-progress, done, withdrawn, cancelled]
        skipped:
          type: array
          description: >-
            The steps that a condition skipped, with the condition that
            skipped them (S05).
          items:
            type: object
            description: >-
              One skipped step and the JSON Logic condition that
              skipped it (S05, FM-5).
            required: [step, condition]
            properties:
              step:
                type: string
              condition:
                description: >-
                  The JSON Logic condition that skipped the step (FM-5).
    InstanceView:
      type: object
      description: >-
        The instance as one actor and the current step see it (#76, FM-2, FM-3,
        FM-7, VT-4, #228). The rules of the step decide `visible`, `editable`,
        `required` and `collapsed`; the values hold only the field keys the
        current step makes visible, so a field the step hides is absent (FM-3
        criterion 1). `fields` and `outcomes` carry the visible field
        definitions and the outcomes of the current step, so an assignee who
        holds only a `step.outcome` grant renders and completes the task
        without reading the whole published definition (AC-4, I8).
      required:
        - instanceId
        - status
        - tracker
        - visible
        - editable
        - required
        - collapsed
        - values
        - fields
        - outcomes
        - allowedOutcomes
        - version
        - previousSteps
        - notes
        - canWithdraw
        - canCancel
        - canTakeOver
      properties:
        instanceId:
          type: string
          description: The id of the instance the view describes (DX-1, #187).
        version:
          type: integer
          minimum: 0
          description: >-
            The version of the instance that this read reflects (I5). A client
            sends it back with a completion or a claim, so a stale view is
            refused at once.
        status:
          $ref: '#/components/schemas/Status'
        tracker:
          type: array
          description: >-
            The per-step tracker (VT-2, S14, #244), one entry per definition
            step in definition order. Each step shows one state, and the read
            adds the holder of the open step, the condition that skipped a
            step and the comment that sent one back. The engine reads it from
            the instance, its pinned definition and the log (I4, I6), so the
            tracker never shows another instance's history.
          items:
            $ref: '#/components/schemas/TrackerStep'
        visible:
          type: array
          description: >-
            The field keys the current step makes visible, in
            definition order, after its rules (FM-2, FM-3).
          items:
            type: string
        editable:
          type: array
          description: >-
            The field keys the actor may edit on the current step, after its
            lock rules (FM-2, FM-3); empty when the actor is not an assignee
            of the step.
          items:
            type: string
        required:
          type: array
          description: >-
            The field keys the current step requires, after its rules (FM-2);
            a hidden or skipped field is not required.
          items:
            type: string
        collapsed:
          type: array
          description: >-
            The section keys the current step shows collapsed, after its rules
            and the section presentation default (FM-1, FM-2).
          items:
            type: string
        values:
          type: object
          description: >-
            The values the instance holds, restricted to the visible field
            keys (FM-3, FM-7).
          additionalProperties: true
        fields:
          type: array
          description: >-
            The definitions of the visible fields, in definition order
            (FM-1, FM-3). A field the step hides is absent, exactly as its
            value is, so the read decides the form without the whole
            definition.
          items:
            $ref: '#/components/schemas/InstanceField'
        outcomes:
          type: array
          description: >-
            The outcomes the current step offers (AC-4, WF-2), in definition
            order; empty when the step declares none or no step is open.
          items:
            type: string
        allowedOutcomes:
          type: array
          description: >-
            The outcomes of the current step the acting principal may choose
            (AC-4, S02): a `step.outcome:<name>` scope on the step or on the
            flow allows that outcome and no other. The page offers these
            alone, so a reviewer with `send_back` only sees Send back.
          items:
            type: string
        previousSteps:
          type: array
          description: >-
            The definition keys before the current step, in definition order
            (WF-3, S11). They are the steps a send back may return the
            instance to; empty when the current step is the first or no step
            is open.
          items:
            type: string
        notes:
          type: array
          description: >-
            The notes on this instance that the actor may read (VT-3, I8):
            the author always reads a note, and so does a holder of the noted
            step's outcome scope. A note of another instance, or of a step
            whose outcome scope the actor does not hold, is absent.
          items:
            $ref: '#/components/schemas/Note'
        withdrawal:
          type: string
          enum: [withdrawn, cancelled]
          description: >-
            How the instance was closed (S13, WF-4); absent while it is live.
            A withdrawal is the starter's own (AC-5) and a cancellation needs
            `instance.cancel` on the flow (AC-1).
        closeReason:
          type: string
          description: >-
            The reason that the closer gave (S13, WF-4); absent while the
            instance is live and after an undo.
        closedAt:
          type: integer
          description: >-
            When the instance was closed, in milliseconds since the epoch
            (S13, I6); absent while it is live.
        closedBy:
          $ref: '#/components/schemas/ActorId'
        undoUntil:
          type: integer
          description: >-
            The end of the flow's undo period: `closedAt` plus the flow's
            `undoHours`, or the server default of 24 hours when the flow does
            not set one (WF-5, S13). The closer sees the Undo control before
            this time; absent while the instance is live.
        canWithdraw:
          type: boolean
          description: >-
            Whether the actor may withdraw the open instance (S13, WF-4, AC-5):
            only its starter, and only while a task is open. The page uses it
            to show the control; the engine still authorizes the write (A9,
            I8).
        canCancel:
          type: boolean
          description: >-
            Whether the actor may cancel the open instance (S13, WF-4, AC-5,
            AC-1): it holds `instance.cancel` on the flow, and a task is open.
            The page uses it to show the control; the engine still authorizes
            the write (A9, I8).
        canTakeOver:
          type: boolean
          description: >-
            Whether the actor may take over the current task (S10, AS-3): it
            is an assignee of the current step, the step allows a takeover,
            and another principal holds the task. The page uses it to show the
            control; the engine still authorizes the write and measures the
            idle period (A9, I8).
        takeoverAvailableAt:
          type: integer
          description: >-
            When a takeover becomes available for an `after-idle` step (S10,
            AS-3): the claim time from the log plus the step's idle period. It
            is absent for `always` and `never`, and while no holder has a
            claim.
        rebound:
          type: object
          description: >-
            The rebind of an open draft to a newer published version (RT-6,
            S04): present on a draft the log moved, absent otherwise. The
            starter's read of a draft moves it to the newest version first.
            The draft keeps every value; `misfits` names the values that no
            longer fit the request form and `newRequired` the required fields
            of the new form the draft leaves empty.
          required: [from, to, misfits, newRequired]
          properties:
            from:
              type: string
              description: The content hash of the version the draft left (DF-2).
            to:
              type: string
              description: The content hash of the version the draft is on (DF-2).
            misfits:
              type: array
              items:
                type: object
                required: [key, reason]
                properties:
                  key:
                    type: string
                  reason:
                    type: string
            newRequired:
              type: array
              items:
                type: string
    Note:
      type: object
      description: >-
        One note on the timeline (VT-3, WF-3): the comment that an attributed
        event records on a step. A send back records one on the step it
        addresses, and a completion that carries a comment records one on the
        completed step.
      required: [step, actor, comment]
      properties:
        step:
          type: string
          description: The step the note sits on (WF-3).
        actor:
          $ref: '#/components/schemas/ActorId'
        comment:
          type: string
          description: The comment itself (WF-3).
    TrackerStep:
      type: object
      description: >-
        One step of the per-step tracker (VT-2, S14, #244, #246, #248). It is
        one definition step in definition order, with the one state it shows
        and, when the log holds them, the holder of the open step, the
        condition that skipped the step, the comment that sent it back, the
        time the instance entered the step, the newest event for it and the
        due time that the step's deadline sets (SE-3, SE-4).
      required: [key, state]
      properties:
        key:
          type: string
          description: The definition key of the step (WF-1).
        state:
          type: string
          description: The one state the step shows (VT-2).
          enum: [not-reached, unopened, opened, completed, skipped, sent-back]
        holder:
          $ref: '#/components/schemas/ActorId'
        condition:
          description: >-
            The JSON Logic condition that skipped the step (S05, WF-1); the
            VT-2 reason. It is absent for a step that was not skipped.
        comment:
          type: string
          description: >-
            The comment that sent the step back (WF-3, S11). It is absent for
            a step that no send back reopened.
        startAt:
          type: integer
          description: >-
            When the instance entered the step (VT-2, S14): the start for the
            first active step, the completion that advanced to it, or the
            send back that reopened it. It is absent for a step that the
            instance never entered.
        lastActivityAt:
          type: integer
          description: >-
            The newest event for the step (VT-2, S14): a claim (including a
            takeover), a completion or a send back. It is absent until the
            log records one, so a step that waits unopened carries only its
            start time.
        dueAt:
          type: integer
          description: >-
            Milliseconds since the epoch from the injected clock (I6): the
            due time of the step (VT-2, SE-4), the time the instance entered
            the step plus the step's deadline. It is absent when the step sets
            no deadline or the instance never entered it.
    InstanceField:
      type: object
      description: >-
        One visible field of the current step, as the instance read returns it
        (#228, #230, FM-1, FM-3): the key, the human label when the definition
        carries one, the control the form renders, and the options of a choice
        control. It carries no hidden field.
      required: [key, control]
      properties:
        key:
          type: string
          description: The field key (FM-1).
        control:
          type: string
          description: The FM-1 control that renders the field (FM-1).
          enum:
            - text
            - long-text
            - number
            - money
            - date
            - select
            - multi-select
            - checkbox
            - radio
            - yes-no
            - email
            - phone
            - file
            - user
            - static
            - repeating
        label:
          type: string
          description: >-
            The human label the form shows; absent means the form shows the
            key (FM-1).
        options:
          type: array
          description: >-
            The options of a choice control, in definition order (FM-1);
            absent when the control has none.
          items:
            type: string
    ApiError:
      type: object
      description: >-
        An error response that names the reason and, when it has them, a
        machine-readable code and the field errors that caused it. A 4xx
        response of the HTTP API carries this shape; a completion refusal keeps
        `CompletionRefusal`, which always lists its field errors.
      required: [error]
      properties:
        error:
          type: string
          description: A short reason that the reader can act on.
        code:
          type: string
          description: >-
            A stable machine-readable code for the reason, for example
            `slug-exists`, `version-stale` or `invalid-definition`.
        errors:
          type: array
          description: >-
            Every field error of a refused request, by path (FM-1, FM-4);
            absent when no field of the request is at fault.
          items:
            $ref: '#/components/schemas/FieldError'
        conflicts:
          type: array
          description: >-
            The places a merged draft write could not settle (DF-3, S03):
            present on a 409 of `PUT /api/v1/flows/{slug}/draft` whose
            three-way merge found a place both sides changed differently,
            absent otherwise.
          items:
            $ref: '#/components/schemas/MergeConflict'
    MergeConflict:
      type: object
      description: >-
        One place of a draft that two writes changed differently (DF-3,
        S03): its path, in the shape of a definition change, and the value
        the base, the write and the current draft hold there. A value is
        absent where that side has none.
      required: [path]
      properties:
        path:
          type: string
          description: Where the conflict sits, for example `/steps/request/fields/summary/label`.
        base:
          description: The value of the draft the write was based on.
        ours:
          description: The value the write holds.
        theirs:
          description: The value the current draft holds.
    FieldError:
      type: object
      description: >-
        One validation error: the path of the field that failed and a short
        reason, so a submission can name every error by path (FM-1, FM-4).
      required: [path, message]
      properties:
        path:
          type: string
          description: The key of the field that failed (FM-1).
        message:
          type: string
          description: A short reason for the failure (FM-1).
    CompletionRefusal:
      type: object
      description: >-
        The engine refused the submission and appended nothing (FM-3, FM-4,
        I1). The `error` names the reason, and `errors` lists every validation
        error by field path; it is empty when the reason alone names the
        refusal (a non-editable key, or an actor or outcome refusal).
      required: [error, errors]
      properties:
        error:
          type: string
          description: The reason the engine refused the submission.
        errors:
          type: array
          description: >-
            Every validation error of the refusal, by field path (FM-4);
            empty when `error` alone names the refusal.
          items:
            $ref: '#/components/schemas/FieldError'
    Principal:
      type: object
      description: >-
        The signed-in person (ADR 0012, ID-4). `id` is the identity provider's
        subject, the immutable ID that a grant names, and `groups` holds the
        immutable group ids that the last sign-in synchronized, so a group
        grant reaches the person (ID-4, ID-5). A name or an email address
        identifies nobody.
      required: [id, displayName, groups]
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        displayName:
          type: string
          description: >-
            The display name that the directory holds (ID-4). It is for
            display only.
        email:
          type: string
          description: >-
            The email address that the directory holds (ID-4). It is for
            display only, and it is absent when the directory holds none.
        groups:
          type: array
          description: >-
            The immutable ids of the directory groups that the principal
            belongs to (ID-4, ID-5).
          items:
            $ref: '#/components/schemas/ActorId'
    CliAuth:
      type: object
      description: >-
        What the CLI needs to sign in through the device authorization flow
        (DX-3, RFC 8628): the public client id, the device authorization
        endpoint and the token endpoint of the identity provider.
      required: [clientId, deviceAuthorizationEndpoint, tokenEndpoint]
      properties:
        clientId:
          type: string
        deviceAuthorizationEndpoint:
          type: string
          format: uri
        tokenEndpoint:
          type: string
          format: uri
    Session:
      type: object
      description: >-
        One signed-in session, as `readSession` reports it (ADR 0012). The
        server holds the session row, so logout and deprovisioning revoke it
        and the cookie stops authenticating at once (ID-5). The browser and the
        CLI read the same session: one principal and one session row
        (ADR 0012).
      required: [principal, grants, expiresAt, csrfToken]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        grants:
          type: array
          description: >-
            The grants that apply to the principal (AC-1, DF-5, #264), as the
            server authorizes with them. The builder reads them to disable the
            structural controls for a person who holds `flow.edit` and not
            `flow.build`; the engine authorizes every write again (I8).
          items:
            $ref: '#/components/schemas/Grant'
        expiresAt:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6): the
            absolute expiry of the session (ADR 0012).
        csrfToken:
          type: string
          description: >-
            The token that a state-changing request carries, so a page from
            another origin cannot act as the principal (ADR 0012).
    DirectoryUser:
      type: object
      description: >-
        One user of the built-in directory, as an administrator reads it
        (ID-6, ADR 0012). `status` says whether the user is invited, active or
        disabled, so the administrator sees whom the installation holds; a
        disabled user signs in no more, and the claimed tasks of a
        deprovisioned user return to the pool (ID-5, ID-6).
      required: [id, displayName, email, status, groups]
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        displayName:
          type: string
          description: >-
            The display name that the directory holds (ID-4). It is for
            display only.
        email:
          type: string
          description: >-
            The email address that the directory holds; it is the address that
            an invite goes to (ID-6).
        status:
          type: string
          description: >-
            Whether the user is invited and sets a password on the first
            sign-in, active, or disabled (ID-6).
          enum: [invited, active, disabled]
        groups:
          type: array
          description: >-
            The immutable ids of the groups that the user belongs to (ID-4).
          items:
            $ref: '#/components/schemas/ActorId'
    CreatedUser:
      type: object
      description: >-
        The user that `createUser` created, with the one-time credential (ID-6,
        ADR 0012). It carries the `DirectoryUser` fields plus
        `temporaryPassword`, which the server returns once and logs never. The
        user is enabled and email-verified with no required action, so the
        password signs the user in immediately; enform stores no credential.
      required: [id, displayName, email, status, groups, temporaryPassword]
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        displayName:
          type: string
          description: >-
            The display name that the directory holds (ID-4). It is for
            display only.
        email:
          type: string
          description: The email address that the user signs in with (ID-6).
        status:
          type: string
          description: >-
            Whether the user is invited, active, or disabled (ID-6). A user
            created with a temporary password is active at once.
          enum: [invited, active, disabled]
        groups:
          type: array
          description: >-
            The immutable ids of the groups that the user belongs to (ID-4).
          items:
            $ref: '#/components/schemas/ActorId'
        temporaryPassword:
          type: string
          description: >-
            The generated password that signs the user in (ID-6, ADR 0012).
            The server returns it once, in this response, and logs it never;
            the administrator copies it and hands it to the user.
    CreateUser:
      type: object
      description: >-
        One user to create in the local directory (ID-6, ADR 0012). enform
        creates the user through the identity provider's admin API with its
        service account, because it stores no credentials; there is no
        self-signup (ID-6).
      required: [email, displayName, sendInvite]
      properties:
        email:
          type: string
          description: >-
            The email address that the user signs in with and that the invite
            goes to (ID-6).
        displayName:
          type: string
          description: The display name that the directory holds (ID-4).
        groups:
          type: array
          description: >-
            The immutable ids of the groups that the user joins (ID-4). The
            create path of this slice creates the user without group
            membership; the ids are reserved for the group synchronization of
            ID-5.
          items:
            $ref: '#/components/schemas/ActorId'
        sendInvite:
          type: boolean
          description: >-
            Whether the user receives a one-time invite (ID-6). The mail
            transport is not configured in this slice, so `true` answers 409
            `mail-not-configured`; `false` creates the user with a generated
            temporary password.
    CreateFlow:
      type: object
      description: >-
        One flow to create (DF-1, DF-4). The slug names the flow in its path
        and in a grant resource, so it is fixed at creation (ID-1, `MVP.md`
        5.6). `title` is the name that the builder shows for the flow; the
        definition format has no title, so it is optional and a flow may start
        without one.
      required: [slug]
      properties:
        slug:
          type: string
          description: >-
            The flow slug (ID-1). It names the flow in its URL and in a grant
            resource, and a flow keeps it (`MVP.md` 5.6).
        title:
          type: string
          description: The name that the builder shows for the flow.
    FlowSummary:
      type: object
      description: >-
        One flow in the list that `listFlows` returns (DF-1, DE-4). It
        summarizes the engine's flow state: the draft version is the version
        that the current draft would publish as, which is the published
        version plus one, and 1 when nothing is published yet (DF-2, DF-4).
      required: [slug, draftVersion, updatedAt]
      properties:
        slug:
          type: string
          description: The flow slug (ID-1).
        title:
          type: string
          description: >-
            The title that the builder shows for the flow. It is absent when
            the definition holds none, because the flow definition format has
            no title (`schemas/flow/v2.json`).
        draftVersion:
          type: integer
          minimum: 1
          description: >-
            The version number that the current draft would publish as: the
            published version plus one, or 1 when nothing is published yet
            (DF-2, DF-4).
        publishedVersion:
          type: integer
          minimum: 1
          description: >-
            The newest published version, absent before the first publication
            (DF-2).
        updatedAt:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6): the
            time of the newest event that this flow recorded.
    DraftFlow:
      type: object
      description: >-
        The draft of one flow: the editable copy before publication (DF-1,
        DF-4). `version` names the draft version that a write or a publication
        is based on, so a stale write is refused (I5). `definition` is the
        canonical v2 definition object; it is absent on a flow whose draft is
        still empty, because a definition holds at least one step and the
        engine creates no draft before the first push (DF-4).
      required: [slug, version]
      properties:
        slug:
          type: string
          description: The flow slug (ID-1).
        version:
          type: integer
          minimum: 1
          description: >-
            The draft version that this read is based on and that the next
            write names (DF-2, I5).
        draftHash:
          type: string
          description: >-
            The content hash of the draft definition (DF-2, DF-3, S03): the
            copy this read is based on. A write names it as `baseHash`, so a
            write made beside another one merges with the draft instead of
            replacing it. It is absent while the draft is empty.
        definition:
          type: object
          description: >-
            The canonical v2 definition object (DF-1, I9,
            `schemas/flow/v2.json`): the same document that the CLI pulls and
            pushes (DF-4).
        changes:
          type: array
          description: >-
            The changes that the last write made, as the engine classified
            them (DF-3, DF-5, DF-6). It is absent when the server has no
            classification to report, because the append-only log records the
            definition and not the list of changes (I4).
          items:
            $ref: '#/components/schemas/DefinitionChange'
    DefinitionChange:
      type: object
      description: >-
        One difference between two definitions, as the engine classifies it
        (DF-5, D2, DF-6). An edit-class change touches a label, help text, an
        option list or email copy and needs `flow.edit`; a structural change
        touches the shape of the flow and needs `flow.build`.
      required: [class, message, path]
      properties:
        class:
          type: string
          description: >-
            Whether the change needs `flow.edit` or `flow.build` (DF-5, D2).
          enum: [edit, structural]
        message:
          type: string
          description: >-
            A short description of the difference, for the builder and for a
            refusal (DF-6).
        path:
          type: string
          description: >-
            Where the difference sits (DF-6): a JSON-pointer-like path that
            names steps, sections and fields by key, for example
            `/steps/request/sections/about/fields/summary/label`.
        before:
          description: The value before the change, when one place changed.
        after:
          description: The value after the change, when one place changed.
    DryRunRequest:
      type: object
      description: >-
        What a dry run takes (DR-1, DR-4, DR-5): the version to run (a
        published version number, or `draft`; absent means the draft), the
        data of the request form, the person to run as, and how far to move
        the simulated clock forward, in minutes.
      required: [data]
      properties:
        version:
          type: string
          description: A published version number, or `draft`; absent means the draft.
          pattern: '^([1-9][0-9]*|draft)$'
        data:
          type: object
          additionalProperties: true
        as:
          $ref: '#/components/schemas/ActorId'
        advanceMinutes:
          type: integer
          minimum: 0
    DryRunTimer:
      type: object
      description: One timer of the next step and whether the moved clock fired it (DR-4).
      required: [step, kind, fireAt, fired]
      properties:
        step:
          type: string
        kind:
          type: string
          enum: [reminder, escalation]
        fireAt:
          type: integer
        fired:
          type: boolean
    DefinitionDiff:
      type: object
      description: >-
        The attributed difference between two points of a flow's history
        (DF-6, S03): the net field-level changes from `from` to `to`, each
        with the author and the time of the push that made it. A point is a
        published version number as a string, or `draft`.
      required: [slug, from, to, changes]
      properties:
        slug:
          type: string
          description: The flow slug (ID-1).
        from:
          type: string
          description: The point the difference starts from, a version number or `draft`.
        to:
          type: string
          description: The point the difference ends at, a version number or `draft`.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AttributedChange'
    AttributedChange:
      type: object
      description: >-
        One difference between two points, as the engine classifies it
        (DF-5, DF-6), with the author and the time of the push that made it
        (S03, I14). The author is absent when no push between the two points
        changed the path, for example on the first version.
      required: [class, message, path]
      properties:
        class:
          type: string
          description: Whether the change needs `flow.edit` or `flow.build` (DF-5, D2).
          enum: [edit, structural]
        message:
          type: string
          description: A short description of the difference (DF-6).
        path:
          type: string
          description: Where the difference sits, for example `/steps/request/fields/summary/label`.
        before:
          description: The value before the change, when one place changed.
        after:
          description: The value after the change, when one place changed.
        actor:
          $ref: '#/components/schemas/ActorId'
        at:
          type: integer
          description: When the push that made the change was recorded, in milliseconds since the epoch.
    DryRunResult:
      type: object
      description: >-
        What a dry run shows (DR-1, DR-3, DR-4, S05, S08): the flow and the
        version it ran, the person it ran as, the simulated start time, the
        route with the skipped steps and their conditions, who each active
        step resolves to and why, the step a submit routes to, the preview
        inbox, and the timers of that step.
      required: [flow, version, actor, now, route, assignees, intents, timers]
      properties:
        flow:
          type: string
        version:
          type: string
          description: The published version number that ran, or `draft`.
        actor:
          $ref: '#/components/schemas/ActorId'
        now:
          type: integer
        route:
          $ref: '#/components/schemas/DryRunRoute'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/DryRunAssignee'
        next:
          type: string
        intents:
          type: array
          description: >-
            The preview inbox (DR-3): each side effect as the outbox would
            carry it, with what it would send and to whom.
          items:
            $ref: '#/components/schemas/DryRunIntent'
        timers:
          type: array
          items:
            $ref: '#/components/schemas/DryRunTimer'
    DryRunRoute:
      type: object
      description: >-
        The route of a dry run (S05, WF-1): the active steps in order, and the
        steps a condition skipped with the condition.
      required: [active, skipped]
      properties:
        active:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/DryRunSkipped'
    DryRunSkipped:
      type: object
      required: [step, condition]
      properties:
        step:
          type: string
        condition:
          description: The JSON expression that was true (FM-5).
    DryRunAssignee:
      type: object
      description: Who one active step resolves to, and through which target (S08, AS-1).
      required: [step, target, members]
      properties:
        step:
          type: string
        target:
          type: object
          additionalProperties: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/ActorId'
    DryRunIntent:
      type: object
      description: One side effect of the preview inbox (DR-3), as the outbox would carry it.
      required: [operation, target, payload]
      properties:
        operation:
          type: string
        target:
          type: string
        payload:
          type: object
          additionalProperties: true
    DraftWrite:
      type: object
      description: >-
        One write of a draft definition (DF-4, I5). `version` is the draft
        version that the edit is based on, so the server refuses a stale write
        and appends nothing (I5, A1); `definition` is the whole canonical v2
        definition, because the server diffs it against the draft and
        classifies every change (DF-3, DF-5).
      required: [version, definition]
      properties:
        version:
          type: integer
          minimum: 1
          description: The draft version that the edit is based on (I5).
        baseHash:
          type: string
          description: >-
            The `draftHash` of the draft the edit is based on (DF-3, S03).
            When the draft moved on since, the server merges the edit with
            the current draft three ways: a place only one side changed
            lands, and a place both changed differently is a conflict that
            answers 409 with `conflicts`. Absent, the write replaces the
            draft as before.
        definition:
          type: object
          description: >-
            The canonical v2 definition object (DF-1, I9,
            `schemas/flow/v2.json`).
    PublishDraft:
      type: object
      description: >-
        One request to publish the draft (DF-2, I5). `version` is the draft
        version that the client publishes, so a publication that is based on a
        stale read writes nothing.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The draft version that the publication is based on (I5).
    DirectoryGroupMember:
      type: object
      description: >-
        One member of a directory group (ID-6, AS-1). The id is the immutable
        Keycloak subject that a group target resolves to (ID-4).
      required: [id, displayName, email]
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        displayName:
          type: string
          description: The display name that the directory holds (ID-4).
        email:
          type: string
          description: The email address that the directory holds (ID-6).
    DirectoryGroup:
      type: object
      description: >-
        One group of the built-in directory and the members it holds now
        (ID-6, AS-1). A `group` target names the group id, and the resolver
        reads the members through the identity provider's admin API (AS-4).
      required: [id, name, members]
      properties:
        id:
          $ref: '#/components/schemas/ActorId'
        name:
          type: string
          description: The human name of the group (ID-6).
        path:
          type: string
          description: >-
            The group path in the realm, when the provider reports one.
        members:
          type: array
          description: The users that the group holds directly (AS-1).
          items:
            $ref: '#/components/schemas/DirectoryGroupMember'
    UnroutableItem:
      type: object
      description: >-
        One open task in the Unroutable queue (I10, AS-5). It names the step
        that resolved to nobody, so the flow owner sees what waits and why.
      required: [instanceId, flowSlug, step, state, lastActivityAt]
      properties:
        instanceId:
          type: string
          description: The id of the instance that the task belongs to (DX-1).
        flowSlug:
          type: string
          description: The slug of the flow that the instance runs (ID-1).
        step:
          type: string
          description: >-
            The key of the step whose targets resolved to nobody (WF-1).
        state:
          type: string
          description: The queue state of the task (I10, AS-5).
          enum: [unroutable]
        lastActivityAt:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6): the
            time of the newest event on this instance.
    InboxItem:
      type: object
      description: >-
        One task or instance in the inbox (VT-1, VT-2, S14). The item shows one
        step of one instance with its state, its holder, its due time and the
        last activity on it, so the reader sees whether nobody opened the task
        yet, who holds it, and how long it sits there (VT-2, AS-2).
      required: [instanceId, flowSlug, step, state]
      properties:
        instanceId:
          type: string
          description: >-
            The id of the instance that the task belongs to (DX-1, #187).
        flowSlug:
          type: string
          description: The slug of the flow that the instance runs (ID-1).
        step:
          type: string
          description: The key of the step that the task sits on (WF-1, VT-2).
        state:
          type: string
          description: >-
            The state of the step for this instance (VT-2): a draft the
            starter has not submitted (ADR 0014), not opened yet, opened and
            in progress, completed, skipped by a condition, or sent back for
            revision (VT-2, WF-3, AS-2).
          enum: [draft, unopened, opened, completed, skipped, sent-back]
        holder:
          $ref: '#/components/schemas/ActorId'
        dueAt:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6): the
            due time of the step, which the reminders and the escalation count
            from (VT-2, SE-3, SE-4). It is absent when the step sets no
            deadline.
        lastActivityAt:
          type: number
          description: >-
            Milliseconds since the epoch, from the injected clock (I6): the
            time of the newest event on this instance, so a task that is
            opened shows how long it sits with its holder (VT-2, S14).
