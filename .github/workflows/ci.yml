name: CI

# The complete local check on every pull request, and the two rules of
# MVP.md section 4 and 9.5. `main` accepts pull requests only (MVP.md 11.5).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Local check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the dependencies
        run: make setup

      # make setup installs Chromium into the shared Playwright cache. Its OS
      # libraries are system packages, and install-deps is Linux only, which is
      # why the Makefile does not run it (ADR 0009).
      - name: Install the browser OS libraries
        run: pnpm exec playwright install-deps chromium

      - name: Run the complete local check
        run: make check

      - name: Start PostgreSQL, Keycloak and Mailpit
        run: >-
          docker compose -f deploy/compose.yaml up -d --wait
          postgres keycloak mailpit

      - name: Run the integration suite
        env:
          ENFORM_TEST_DATABASE_URL: >-
            postgres://enform:enform@127.0.0.1:5432/enform
          ENFORM_TEST_KEYCLOAK_URL: http://127.0.0.1:8081
          ENFORM_TEST_KEYCLOAK_REALM: enform-local
          ENFORM_TEST_KEYCLOAK_ADMIN: admin
          ENFORM_TEST_KEYCLOAK_ADMIN_PASSWORD: admin
          ENFORM_TEST_CLIENT_ID: enform
          ENFORM_TEST_CLIENT_SECRET: enform-dev-secret
          ENFORM_TEST_SMTP_URL: smtp://127.0.0.1:1025
          ENFORM_MAIL_FROM: enform@test.local
        run: make integration

      - name: Changelog rule (MVP.md 9.5)
        if: github.event_name == 'pull_request'
        run: node tools/changelog-rule.mjs "origin/${{ github.base_ref }}..HEAD"

      - name: Invariant rule (MVP.md section 4)
        run: node tools/invariant-rule.mjs

      - name: Matrix rule (STORIES.md Coverage)
        run: node tools/matrix-rule.mjs

      - name: Public API rule (I12, MVP.md A3, A9)
        run: node tools/public-api-rule.mjs
