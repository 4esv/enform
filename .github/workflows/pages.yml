name: Documentation site

# Issue #266: build the documentation site from docs/, the charter documents
# and the ADRs, and publish it to GitHub Pages on every push to main. The
# repository's Pages source must be set to "GitHub Actions" once; until then
# the deploy step is skipped and the build still proves the site renders.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - docs/**
      - tools/site.mjs
      - MVP.md
      - STORIES.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - api/openapi.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || 'https://4esv.github.io/enform/' }}
        run: node tools/site.mjs site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
