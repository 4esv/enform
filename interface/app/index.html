<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>enform</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      // The form link carries the flow and the principal (S06: Sam opens the
      // form link): /app/?slug=<flow>&actor=<principal>. The page and the API
      // share one origin, so baseUrl defaults to it, and gui mode can point a
      // browser at any flow without changing the app.
      import { mountApp } from './app.js'

      // The deterministic sources that gui mode injects (I6). A real user never
      // sets them, so the app behaves identically; gui mode supplies the same
      // step clock and ID sources that stepOperation uses, so the browser's
      // intent carries the golden `op-<i+1>`, the step's instance id and
      // `at = <i+1>` exactly.
      const sources = globalThis.__enformSources

      const params = new URLSearchParams(location.search)
      mountApp({
        root: document.getElementById('app'),
        baseUrl: params.get('baseUrl') ?? location.origin,
        token: params.get('token') ?? '',
        slug: params.get('slug') ?? '',
        actor: params.get('actor') ?? '',
        ...(sources
          ? { clock: sources.clock, ids: sources.ids, instanceIds: sources.instanceIds }
          : {}),
      })
    </script>
  </body>
</html>
