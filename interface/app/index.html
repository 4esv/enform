<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>enform</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      // Issue #224, ADR 0009, ADR 0012: the page and the API share one origin,
      // so baseUrl is the origin. A production page reads the session cookie;
      // the gui/harness link carries the flow and the principal instead:
      // /app/?slug=<flow>&actor=<principal>. The task page adds instance=<id>.
      // The pages of the release server are /?flow=<slug>, /?flow=<slug>&builder=1
      // and /?flow=<slug>&instance=<id>; both spellings name the same flow here.
      import { mountApp } from '/app/app.js'

      // The deterministic sources that gui mode injects (I6). A real user never
      // sets them, so the app behaves identically; gui mode supplies the same
      // step clock and ID sources that stepOperation uses, so the browser's
      // intent carries the golden `op-<i+1>`, the step's instance id and
      // `at = <i+1>` exactly.
      const sources = globalThis.__enformSources

      const params = new URLSearchParams(location.search)
      const instance = params.get('instance')
      const flow = params.get('flow') ?? params.get('slug') ?? ''
      const inbox = params.get('inbox') === '1'
      const users = params.get('users') === '1'
      mountApp({
        root: document.getElementById('app'),
        baseUrl: params.get('baseUrl') ?? location.origin,
        slug: flow,
        actor: params.get('actor') ?? '',
        ...(instance === null ? {} : { instance }),
        ...(params.get('builder') === '1' ? { builder: true } : {}),
        ...(params.get('new') === '1' ? { newFlow: true } : {}),
        ...(inbox ? { inbox: true, inboxTab: params.get('tab') ?? 'my' } : {}),
        ...(users ? { users: true } : {}),
        ...(sources
          ? { clock: sources.clock, ids: sources.ids, instanceIds: sources.instanceIds }
          : {}),
      })
    </script>
  </body>
</html>
